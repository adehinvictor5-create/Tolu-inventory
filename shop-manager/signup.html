<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — Shop Manager</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

  <div class="auth-box">
    <h1 class="auth-title">Shop Manager</h1>

    <label>Name</label>
    <input type="text" id="signup-name" placeholder="Your name">

    <label>Email</label>
    <input type="email" id="signup-email" placeholder="yourname@gmail.com">

    <label>Password</label>
    <div class="password-wrapper">
      <input type="password" id="signup-password" placeholder="Choose a password (8+ characters)">
      <button type="button" class="toggle-password" data-target="signup-password">
        <span class="toggle-text">Show</span>
      </button>
    </div>

    <div id="signup-error" class="auth-error"></div>

    <button id="signup-btn" class="btn btn-primary btn-full">Create account</button>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>

  <script src="auth.js"></script>
  <script>
    // Already logged in? Go straight to the dashboard.
    if (getCurrentUser()) {
      window.location.href = "index.html";
    }

    document.getElementById("signup-btn").addEventListener("click", async () => {
      const name = document.getElementById("signup-name").value.trim();
      const email = document.getElementById("signup-email").value.trim().toLowerCase();
      const password = document.getElementById("signup-password").value;
      const errorEl = document.getElementById("signup-error");

      if (!name || !email || !password) {
        errorEl.textContent = "Fill in every field.";
        return;
      }

      if (password.length < 8) {
        errorEl.textContent = "Password must be at least 8 characters.";
        return;
      }

      const result = await signUp(name, email, password);
      if (!result.ok) {
        errorEl.textContent = result.message;
        return;
      }

      window.location.href = "index.html";
    });
  </script>

</body>

</html>
